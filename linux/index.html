function setStatus(title,detail='',kind='busy'){statusRaw={title,detail,kind};const box=$('status');box.classList.add('show');box.classList.toggle('done',kind==='done');box.classList.toggle('error',kind==='error');$('status-title').textContent=trText(title);$('status-detail').textContent=trText(detail)}
function refreshCount(){let n=$('urls').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).length;if(mode==='search')$('count').textContent=n?`${$('urls').value.trim().length} ${t('countChars')}`:t('countQuery');else $('count').textContent=n===0?t('countEmpty'):n===1?t('countOne'):`${n} ${t('countMany')}`;if(mode==='audio')$('suggest').classList.toggle('show',n===1);else $('suggest').classList.remove('show')}
function renderModeInfo(){document.querySelectorAll('.mode').forEach(b=>{const m=b.dataset.mode;b.querySelector('strong').textContent=t(m);b.querySelector('small').textContent=t(m+'Desc')});const labels={audio:[t('labelAudio'),t('phUrls'),t('hintAudio')],video:[t('labelVideo'),t('phUrls'),t('hintVideo')],spotify:[t('labelSpotify'),t('phSpotify'),t('hintSpotify')],search:[t('labelSearch'),t('phSearch'),t('hintSearch')]};const v=labels[mode];$('url-label').textContent=v[0];$('urls').placeholder=v[1];$('hint').textContent=v[2];$('urls').style.direction=mode==='search'?(lang==='ar'?'rtl':'ltr'):'ltr';$('urls').style.textAlign=mode==='search'?(lang==='ar'?'right':'left'):'left';$('search-tools').classList.toggle('show',mode==='search');$('bottom').style.display=mode==='search'?'none':'flex';$('suggest-btn').style.display=mode==='audio'?'inline-flex':'none';$('artist-label').textContent=t('artistLabel');$('artist').placeholder=t('artistPlaceholder');$('title-label').textContent=t('titleLabel');$('title').placeholder=t('titlePlaceholder');$('suggest-btn').textContent=t('suggestButton');$('format-label').textContent=t('formatLabel');document.querySelectorAll('.format-option').forEach(b=>{b.textContent=t(b.dataset.format==='audio'?'formatAudio':'formatVideo');b.classList.toggle('active',b.dataset.format===searchFormat);b.setAttribute('aria-pressed',String(b.dataset.format===searchFormat))});$('search-btn').textContent=$('search-btn').disabled?t('searchButtonBusy'):t('searchButton');$('location').innerHTML=`${t('location')}<br><b>${mode==='video'?t('videosFolder'):t('musicFolder')}</b>`;$('download-text').textContent=t('download');refreshCount()}
function setMode(next){mode=next;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('status').classList.remove('show','done','error');resultItems=[];searchErrorRaw='';$('results').replaceChildren();renderModeInfo()}
function applyLanguage(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('brandname').textContent=t('brand');$('brandhint').textContent=t('brandhint');$('local-label').textContent=t('local');$('language-toggle').textContent=t('language');$('hero-eyebrow').textContent=t('eyebrow');$('hero-title').textContent=t('heroTitle');$('hero-text').textContent=t('heroText');$('section-title').textContent=t('section');$('notice').textContent=t('notice');renderModeInfo();renderResults();if(statusRaw.title)setStatus(statusRaw.title,statusRaw.detail,statusRaw.kind);send('language',{language:lang})}
function chooseLanguage(next){lang=next;try{localStorage.setItem('download-song-language',lang)}catch(e){}applyLanguage()}
function setFormat(next){searchFormat=next;renderModeInfo();renderResults()}
function renderResults(){const box=$('results');box.replaceChildren();if(searchErrorRaw){const row=document.createElement('div');row.className='search-empty';row.textContent=trText(searchErrorRaw);box.append(row);return}resultItems.forEach(item=>{const row=document.createElement('div');row.className='result';const thumb=document.createElement('div');thumb.className='thumb';const fallback=document.createElement('span');fallback.className='thumb-fallback';fallback.textContent='♫';thumb.append(fallback);if(item.thumbnail){const img=document.createElement('img');img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';img.addEventListener('load',()=>{fallback.hidden=true});img.addEventListener('error',()=>{img.remove()});img.src=item.thumbnail;thumb.append(img)}const copy=document.createElement('div');copy.className='result-copy';const title=document.createElement('div');title.className='result-title';title.textContent=item.title||'—';const meta=document.createElement('div');meta.className='result-meta';const sec=Number(item.duration),dur=Number.isFinite(sec)&&sec>0?` · ${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`:'';meta.textContent=(item.channel||t('channelUnknown'))+dur;copy.append(title,meta);const button=document.createElement('button');button.className='result-download';button.type='button';button.textContent=t(searchFormat==='audio'?'downloadTrack':'downloadVideo');button.addEventListener('click',()=>downloadResult(item));row.append(thumb,copy,button);box.append(row)})}
function downloadResult(item){document.querySelectorAll('.result-download').forEach(b=>b.disabled=true);$('search-btn').disabled=true;renderModeInfo();setStatus(t(searchFormat==='audio'?'startedAudio':'startedVideo'),item.title||'','busy');send('download',{mode:searchFormat,urls:[item.url],artist:'',title:''})}
function showSearchError(message){searchErrorRaw=message;resultItems=[];renderResults();setStatus(t('searchError'),message,'error')}
function search(){const query=$('urls').value.trim();if(!query){showSearchError(t('queryRequired'));$('urls').focus();return}searchErrorRaw='';resultItems=[];renderResults();setStatus(t('searching'),t('searchLoading'),'busy');$('search-btn').disabled=true;renderModeInfo();send('search',{query})}
function searchResults(items){resultItems=Array.isArray(items)?items:[];searchErrorRaw='';if(!resultItems.length){showSearchError(t('searchEmpty'));return}renderResults();setStatus(t('searchChoose'),t('searchChooseDetail'),'done')}
function suggest(){const list=$('urls').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(list.length!==1){setStatus(t('queryRequired'),'','error');return}setStatus(t('suggesting'),t('suggestHint'),'busy');send('suggest',{url:list[0]})}
function downloadDirect(){const list=$('urls').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!list.length){setStatus(t('countEmpty'),'','error');$('urls').focus();return}if(mode==='spotify'&&list.length!==1){setStatus(t('spotifyOne'),t('badSpotifyDetail'),'error');return}if(mode==='audio'&&list.length===1){const artist=$('artist').value.trim(),title=$('title').value.trim();if((artist&&!title)||(!artist&&title)){setStatus(t('needArtist'),t('needArtistDetail'),'error');return}send('download',{mode,urls:list,artist,title})}else send('download',{mode,urls:list});$('download').disabled=true;setStatus(t('preparing'),`${t('links')}: ${list.length}`,'busy')}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.querySelectorAll('.format-option').forEach(b=>b.addEventListener('click',()=>setFormat(b.dataset.format)));$('language-toggle').addEventListener('click',()=>chooseLanguage(lang==='ar'?'en':'ar'));$('urls').addEventListener('input',()=>{refreshCount();if(mode==='search'){resultItems=[];searchErrorRaw='';renderResults()}});$('urls').addEventListener('keydown',e=>{if(mode==='search'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();search()}});$('search-btn').addEventListener('click',search);$('suggest-btn').addEventListener('click',suggest);$('download').addEventListener('click',downloadDirect);
window.searchState=d=>{$('search-btn').disabled=!!d.active;renderModeInfo();if(d.active)setStatus(t('searching'),t('searchLoading'),'busy')};window.showSearchError=msg=>showSearchError(msg);window.showSearchResults=items=>searchResults(items);window.applySuggestion=d=>{if(d.artist)$('artist').value=d.artist;if(d.title)$('title').value=d.title;if(d.error)setStatus(t('suggestError'),d.error,'error');else setStatus(t('suggestReady'),t('suggestReadyDetail'),'done')};window.updateStatus=d=>{if(d.title)setStatus(d.title,d.detail||'',d.kind||'busy');if(d.active===false){$('download').disabled=false;document.querySelectorAll('.result-download').forEach(b=>b.disabled=false);$('search-btn').disabled=false;renderModeInfo()}};
applyLanguage();
</script>
</body>
</html>
